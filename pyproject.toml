[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduoutcomes"
version = "2.0.0"
description = "Calibrated and explainable benchmarking of ensemble and meta-ensemble learning for multiclass prediction of student academic outcomes (UCI 697)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Andrade", email = "dandrade@unjfsc.edu.pe" }]
keywords = ["educational data mining", "dropout", "calibration", "ensemble learning", "explainability", "SHAP"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.6",
  "matplotlib>=3.8",
  "pillow>=10",
  "joblib>=1.3",
  "pyyaml>=6",
  "imbalanced-learn>=0.12",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "shap>=0.45",
  "lime>=0.2.0.1",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7", "ipykernel>=6", "nbstripout>=0.7"]

[project.scripts]
eduoutcomes = "eduoutcomes.cli:main"

[project.urls]
Dataset = "https://archive.ics.uci.edu/dataset/697"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end pipeline run (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E741", "B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/eduoutcomes/stages/*" = ["E501"]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["eduoutcomes"]
