# Corrida reportable bajo demanda con los datos reales de la UCI (puede tardar varias horas).
name: Full pipeline (manual)

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Configuración"
        default: configs/default.yaml
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install exact versions of the manuscript
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - run: eduoutcomes download-data
      - run: eduoutcomes run -c ${{ github.event.inputs.config }} --set output_dir=outputs/main
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.sha }}
          path: outputs/main.zip
